<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found — Report Lost Item</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>

  <header class="site-header">
    <span class="logo">University Lost &amp; Found</span>
    <nav>
      <a href="../index.html">← Back to Home</a>
    </nav>
  </header>

  <div class="page-wrapper">
    <div class="card">
      <h1>Report a Lost Item</h1>
      <p>Fill out the form below and we'll notify you if your item is turned in.</p>

      <form id="lostItemForm" enctype="multipart/form-data">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@university.edu" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (optional)</label>
          <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" />
        </div>

        <div class="form-group">
          <label>Would you like notifications?</label>
          <div class="radio-group">
            <label>
              <input type="radio" name="notifyEmail" value="email" checked />
              Email only
            </label>
            <label>
              <input type="radio" name="notifyEmail" value="sms" />
              SMS only
            </label>
            <label>
              <input type="radio" name="notifyEmail" value="both" />
              Both
            </label>
            <label>
              <input type="radio" name="notifyEmail" value="none" />
              None
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" name="itemName" placeholder="e.g. Black North Face Backpack" required />
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Select a category</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing &amp; Accessories</option>
            <option value="bags">Bags &amp; Backpacks</option>
            <option value="keys">Keys &amp; ID Cards</option>
            <option value="books">Books &amp; Notes</option>
            <option value="jewelry">Jewelry</option>
            <option value="sports">Sports Equipment</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Item Description</label>
          <textarea id="description" name="description"
            placeholder="Describe your item in detail: color, brand, size, any identifying marks..."
            rows="5" required></textarea>
        </div>

        <div class="form-group">
          <label for="dateLost">Date Lost</label>
          <input type="date" id="dateLost" name="dateLost" required />
        </div>

        <div class="form-group">
          <label for="locationLost">Location Lost (if known)</label>
          <input type="text" id="locationLost" name="locationLost"
            placeholder="e.g. Library 2nd floor, Gym locker room" />
        </div>

        <div class="form-group">
          <label for="image">Upload a Photo (optional)</label>
          <input type="file" id="image" name="image" accept="image/*" />
        </div>

        <button type="submit" class="btn btn-primary btn-full">Submit Report</button>

        <div id="formMessage"></div>
      </form>
    </div>
  </div>

  <script src="../js/request-form.js"></script>
</body>
</html>
