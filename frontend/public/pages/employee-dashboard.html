<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found — Employee Dashboard</title>
</head>
<body>

  <h1>Employee Dashboard</h1>
  <p>Lost item requests submitted by students.</p>
  <a href="employee-login.html">Log Out</a>
  <a href="browser-upload.html">Browser Upload</a>

  <hr>

  <label for="searchInput">Search:</label>
  <input type="text" id="searchInput" placeholder="Name, item, or email..." oninput="renderRequests()" />

  &nbsp;

  <label for="statusFilter">Status:</label>
  <select id="statusFilter" onchange="renderRequests()">
    <option value="">All</option>
    <option value="new">New</option>
    <option value="matched">Matched</option>
    <option value="notified">Notified</option>
    <option value="closed">Closed</option>
  </select>

  &nbsp;

  <button onclick="clearAll()">Clear All Requests</button>

  <hr>

  <table border="1" cellpadding="6" cellspacing="0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Item</th>
        <th>Category</th>
        <th>Description</th>
        <th>Date Lost</th>
        <th>Location</th>
        <th>Notify Via</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="requestsBody">
      <tr><td colspan="11">No requests yet.</td></tr>
    </tbody>
  </table>

  <script>
  let allRequests = [];
  let foundItems = [];

    function loadRequests() {
      allRequests = JSON.parse(localStorage.getItem("lostRequests") || "[]");
      foundItems = JSON.parse(localStorage.getItem("foundItems") || "[]");
      renderRequests();
    }

    function saveLocally() {
      localStorage.setItem("lostRequests", JSON.stringify(allRequests));
    }

    function renderRequests() {
      const search  = document.getElementById("searchInput").value.toLowerCase();
      const statusF = document.getElementById("statusFilter").value;
      const tbody   = document.getElementById("requestsBody");

      // Convert foundItems into request-like rows (prefix ids to avoid collisions)
      const foundConverted = foundItems.map(fi => ({
        id: `found-${fi.id}`,
        name: '',
        email: '',
        phone: '',
        itemName: fi.name || fi.itemName || 'Unnamed Item',
        category: fi.category || '',
        description: fi.description || '',
        dateLost: fi.date_found || fi.dateLost || '',
        locationLost: fi.location_found || fi.locationLost || '',
        notify: '',
        status: fi.status || 'FOUND',
        image_url: fi.image_url || ''
      }));

      const combined = [...allRequests, ...foundConverted];

      const filtered = combined.filter(r => {
        const matchSearch = !search ||
          (r.name && r.name.toLowerCase().includes(search)) ||
          (r.itemName && r.itemName.toLowerCase().includes(search)) ||
          (r.email && r.email.toLowerCase().includes(search));
        const matchStatus = !statusF || r.status === statusF;
        return matchSearch && matchStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = "<tr><td colspan='11'>No requests found.</td></tr>";
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const isFoundItem = String(r.id).startsWith('found-');
        const actions = isFoundItem
          ? `${r.image_url ? `<button onclick="toggleImageInTable('img-${r.id}')">Expand Image</button>` : ''}`
          : `${r.status === 'new'     ? `<button onclick="updateStatus(${r.id}, 'matched')">Mark Matched</button>` : ''}
             ${r.status === 'matched' ? `<button onclick="updateStatus(${r.id}, 'notified')">Mark Notified</button>` : ''}
             ${r.status !== 'closed'  ? `<button onclick="updateStatus(${r.id}, 'closed')">Close</button>` : ''}`;

        return `
          <tr>
            <td>${r.name || '—'}</td>
            <td>${r.email || '—'}</td>
            <td>${r.phone || '—'}</td>
            <td>${r.itemName}</td>
            <td>${r.category || '—'}</td>
            <td>${r.description}</td>
            <td>${r.dateLost || '—'}</td>
            <td>${r.locationLost || '—'}</td>
            <td>${r.notify || '—'}</td>
            <td>${r.status}</td>
            <td>
              ${actions}
            </td>
          </tr>
          ${r.image_url ? `<tr id="img-${r.id}" style="display:none;"><td colspan="11" style="text-align:center;"><img src="${r.image_url}" alt="${r.itemName}" style="max-width:300px; max-height:300px; object-fit:contain;" /></td></tr>` : ''}
        `;
      }).join('');
    }

    function updateStatus(id, newStatus) {
      const req = allRequests.find(r => r.id === id);
      if (!req) return;
      req.status = newStatus;
      saveLocally();
      renderRequests();
    }

    function clearAll() {
      if (!confirm("Clear all requests? This cannot be undone.")) return;
      localStorage.removeItem("lostRequests");
      allRequests = [];
      renderRequests();
    }

    function toggleImageInTable(rowId) {
      const el = document.getElementById(rowId);
      if (!el) return;
      el.style.display = el.style.display === 'none' ? '' : 'none';
    }

    // Load on page open
    loadRequests();
  </script>
</body>
</html>
