<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost & Found — Browse Found Items</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/employee.css" />
</head>
<body>

  <header class="site-header">
    <span class="logo">University Lost &amp; Found</span>
    <nav>
      <a href="../index.html">← Back to Home</a>
      <a href="lost-item-request-form.html">Report Lost Item</a>
    </nav>
  </header>

  <div class="page-wrapper" style="align-items: stretch; max-width: 1000px; margin: 0 auto;">

    <div style="padding: 32px 16px 0;">
      <h1>Browse Found Items</h1>
      <p>Items currently held at the Lost &amp; Found desk. See something that's yours? Submit a request!</p>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search by name or description..." />
        <select id="categoryFilter">
          <option value="">All Categories</option>
          <option value="electronics">Electronics</option>
          <option value="clothing">Clothing &amp; Accessories</option>
          <option value="bags">Bags &amp; Backpacks</option>
          <option value="keys">Keys &amp; ID Cards</option>
          <option value="books">Books &amp; Notes</option>
          <option value="jewelry">Jewelry</option>
          <option value="sports">Sports Equipment</option>
          <option value="other">Other</option>
        </select>
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option value="FOUND">Available</option>
          <option value="CLAIMED">Claimed</option>
          <option value="RETURNED">Returned</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadItems()">Search</button>
      </div>
    </div>

    <div id="itemGrid" class="item-grid" style="padding: 0 16px 40px;">
      <p id="loadingMsg" style="color: var(--color-text-muted);">Loading items...</p>
    </div>

  </div>

  <script>
    const API_URL = "/api/found-items";

    let allItems = [];

    const fallbackItems = [
      {
        id: 1,
        name: "Black Water Bottle",
        description: "Matte black metal bottle with a dent near the bottom.",
        category: "other",
        status: "FOUND",
        location_found: "Student Union",
        date_found: "2026-03-15",
        image_url: ""
      }
    ];

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatCategory(category) {
      if (!category) return "Uncategorized";

      const categoryMap = {
        electronics: "Electronics",
        clothing: "Clothing & Accessories",
        bags: "Bags & Backpacks",
        keys: "Keys & ID Cards",
        books: "Books & Notes",
        jewelry: "Jewelry",
        sports: "Sports Equipment",
        other: "Other"
      };

      return categoryMap[category] || category;
    }

    function formatStatus(status) {
      if (!status) return "Unknown";

      const statusMap = {
        FOUND: "Available",
        CLAIMED: "Claimed",
        RETURNED: "Returned"
      };

      return statusMap[status] || status;
    }

    function formatDate(dateString) {
      if (!dateString) return "Unknown date";

      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return dateString;

      return date.toLocaleDateString();
    }

    function createItemCard(item) {
      const safeName = escapeHtml(item.name || "Unnamed Item");
      const safeDescription = escapeHtml(item.description || "No description provided.");
      const safeCategory = escapeHtml(formatCategory(item.category));
      const safeStatus = escapeHtml(formatStatus(item.status));
      const safeLocation = escapeHtml(item.location_found || "Unknown location");
      const safeDate = escapeHtml(formatDate(item.date_found));
      const safeImageUrl = item.image_url ? escapeHtml(item.image_url) : "";

      return `
        <div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
          <div
            style="
              width: 100%;
              height: 180px;
              border-radius: 12px;
              background: var(--color-surface-muted, #f3f4f6);
              display: flex;
              align-items: center;
              justify-content: center;
              overflow: hidden;
              color: var(--color-text-muted);
              font-size: 0.95rem;
            "
          >
            ${
              safeImageUrl
                ? `<img src="${safeImageUrl}" alt="${safeName}" style="width: 100%; height: 100%; object-fit: cover;" />`
                : `<span>No image available</span>`
            }
          </div>

          <div>
            <h3 style="margin: 0 0 6px;">${safeName}</h3>
            <p style="margin: 0; color: var(--color-text-muted);">${safeDescription}</p>
          </div>

          <div style="display: grid; gap: 6px; font-size: 0.95rem;">
            <div><strong>Category:</strong> ${safeCategory}</div>
            <div><strong>Status:</strong> ${safeStatus}</div>
            <div><strong>Found At:</strong> ${safeLocation}</div>
            <div><strong>Date Found:</strong> ${safeDate}</div>
          </div>

          <div style="margin-top: auto;">
            <button
              class="btn btn-primary btn-sm"
              onclick="handleClaimClick(${item.id})"
            >
              This Might Be Mine
            </button>
          </div>
        </div>
      `;
    }

    function handleClaimClick(itemId) {
      alert("Your request has been notified to employees, expect notifications in 1-3 business days.");
    }

    function getFilteredItems() {
      const searchValue = document.getElementById("searchInput").value.trim().toLowerCase();
      const categoryValue = document.getElementById("categoryFilter").value;
      const statusValue = document.getElementById("statusFilter").value;

      return allItems.filter((item) => {
        const matchesSearch =
          !searchValue ||
          (item.name && item.name.toLowerCase().includes(searchValue)) ||
          (item.description && item.description.toLowerCase().includes(searchValue));

        const matchesCategory =
          !categoryValue || item.category === categoryValue;

        const matchesStatus =
          !statusValue || item.status === statusValue;

        return matchesSearch && matchesCategory && matchesStatus;
      });
    }

    function renderItems(items) {
      const itemGrid = document.getElementById("itemGrid");

      if (!items || items.length === 0) {
        itemGrid.innerHTML = `
          <p style="color: var(--color-text-muted);">
            No items matched your search.
          </p>
        `;
        return;
      }

      itemGrid.innerHTML = items.map(createItemCard).join("");
    }

    async function loadItems() {
      const itemGrid = document.getElementById("itemGrid");
      itemGrid.innerHTML = `
        <p id="loadingMsg" style="color: var(--color-text-muted);">Loading items...</p>
      `;

      const localRequests = JSON.parse(localStorage.getItem("lostRequests") || "[]");
      const localItems = localRequests.map(r => ({
        id:             r.id,
        name:           r.itemName,
        description:    r.description,
        category:       r.category,
        status:         "FOUND",
        location_found: r.locationLost || "Unknown location",
        date_found:     r.dateLost,
        image_url:      ""
      }));

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("Failed to fetch");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("Invalid data");
        }

        allItems = [...data, ...localItems];
      } catch (error) {
        console.warn("Using fallback data:", error);
        allItems = [...fallbackItems, ...localItems];
      }

      renderItems(getFilteredItems());
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      renderItems(getFilteredItems());
    });

    document.getElementById("categoryFilter").addEventListener("change", () => {
      renderItems(getFilteredItems());
    });

    document.getElementById("statusFilter").addEventListener("change", () => {
      renderItems(getFilteredItems());
    });

    document.addEventListener("DOMContentLoaded", loadItems);
  </script>

</body>
</html>
