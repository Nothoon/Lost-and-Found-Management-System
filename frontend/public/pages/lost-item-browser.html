<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found — Browse Found Items</title>
</head>
<body>

  <h1>Browse Found Items</h1>
  <p>Items currently held at the Lost &amp; Found desk. Only unclaimed items are shown.</p>
  <a href="../index.html">← Back to Home</a>
  &nbsp;|&nbsp;
  <a href="lost-item-request-form.html">Report a Lost Item</a>

  <hr>

  <label for="searchInput">Search:</label>
  <input type="text" id="searchInput" placeholder="Search by name or description..." oninput="renderItems()" />
  &nbsp;
  <label for="categoryFilter">Category:</label>
  <select id="categoryFilter" onchange="renderItems()">
    <option value="">All Categories</option>
    <option value="electronics">Electronics</option>
    <option value="clothing">Clothing &amp; Accessories</option>
    <option value="bags">Bags &amp; Backpacks</option>
    <option value="keys">Keys &amp; ID Cards</option>
    <option value="books">Books &amp; Notes</option>
    <option value="jewelry">Jewelry</option>
    <option value="sports">Sports Equipment</option>
    <option value="other">Other</option>
  </select>

  <hr>

  <div id="itemGrid" style="display:flex; flex-wrap:wrap; gap:16px; margin-top:8px;">
    <p>Loading items...</p>
  </div>

  <script>
    let allItems = [];

    function loadItems() {
      const stored = JSON.parse(localStorage.getItem("foundItems") || "[]");

      // Only show items that are:
      // 1. Not matched or claimed
      // 2. NOT marked as hidden
      allItems = stored.filter(item =>
        item.status !== "matched" &&
        item.status !== "claimed" &&
        !item.hidden
      );

      renderItems();
    }

    function renderItems() {
      const search   = document.getElementById("searchInput").value.toLowerCase();
      const category = document.getElementById("categoryFilter").value;
      const grid     = document.getElementById("itemGrid");

      const filtered = allItems.filter(item => {
        const matchSearch = !search ||
          (item.itemName    && item.itemName.toLowerCase().includes(search)) ||
          (item.description && item.description.toLowerCase().includes(search));
        const matchCategory = !category || item.category === category;
        return matchSearch && matchCategory;
      });

      if (filtered.length === 0) {
        grid.innerHTML = "<p>No unclaimed items found.</p>";
        return;
      }

      grid.innerHTML = filtered.map(item => createCard(item)).join("");
    }

    function createCard(item) {
      const categoryLabels = {
        electronics: "Electronics",
        clothing:    "Clothing & Accessories",
        bags:        "Bags & Backpacks",
        keys:        "Keys & ID Cards",
        books:       "Books & Notes",
        jewelry:     "Jewelry",
        sports:      "Sports Equipment",
        other:       "Other",
      };

      const categoryLabel = categoryLabels[item.category] || item.category || "—";

      const imageHtml = item.imageData
        ? `<img src="${item.imageData}" alt="${escapeHtml(item.itemName)}"
             style="width:100%; max-height:180px; object-fit:cover; border:1px solid #ccc;" />`
        : `<div style="height:80px; display:flex; align-items:center; justify-content:center;
             background:#f0f0f0; color:#888; font-size:0.85rem;">No image</div>`;

      return `
        <div style="border:1px solid #ccc; padding:12px; width:220px; box-sizing:border-box;">
          ${imageHtml}
          <br>
          <strong>${escapeHtml(item.itemName)}</strong><br>
          <small>${categoryLabel}</small><br><br>
          ${escapeHtml(item.description)}<br><br>
          <small>Found at: ${escapeHtml(item.locationFound || "—")}</small><br>
          <small>Date: ${escapeHtml(item.dateFound || "—")}</small><br><br>
          <button onclick="claimItem(${item.id})">This Is My Item</button>
        </div>
      `;
    }

    function claimItem(itemId) {
      const item = allItems.find(i => i.id === itemId);
      if (!item) return;

      const prefill = {
        itemName:     item.itemName,
        category:     item.category,
        description:  item.description,
        locationLost: item.locationFound,
        foundItemId:  item.id,
      };

      localStorage.setItem("claimPrefill", JSON.stringify(prefill));
      window.location.href = "lost-item-request-form.html";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    loadItems();
  </script>
</body>
</html>
