<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found — Report Lost Item</title>
</head>
<body>

  <h1>Report a Lost Item</h1>
  <p>Fill out the form below and we'll notify you if your item is turned in.</p>
  <a href="../index.html">← Back to Home</a>

  <hr>

  <form id="lostItemForm">

    <label for="name">Full Name *</label><br>
    <input type="text" id="name" placeholder="Your full name" required /><br><br>

    <label for="email">Email Address *</label><br>
    <input type="email" id="email" placeholder="name@university.edu" required /><br><br>

    <label for="phone">Phone Number (optional)</label><br>
    <input type="tel" id="phone" placeholder="(555) 000-0000" /><br><br>

    <label>Would you like notifications?</label><br>
    <input type="radio" name="notifyEmail" value="email" checked /> Email only &nbsp;
    <input type="radio" name="notifyEmail" value="sms" /> SMS only &nbsp;
    <input type="radio" name="notifyEmail" value="both" /> Both &nbsp;
    <input type="radio" name="notifyEmail" value="none" /> None<br><br>

    <label for="itemName">Item Name *</label><br>
    <input type="text" id="itemName" placeholder="e.g. Black Backpack" required /><br><br>

    <label for="category">Category *</label><br>
    <select id="category" required>
      <option value="" disabled selected>Select a category</option>
      <option value="electronics">Electronics</option>
      <option value="clothing">Clothing &amp; Accessories</option>
      <option value="bags">Bags &amp; Backpacks</option>
      <option value="keys">Keys &amp; ID Cards</option>
      <option value="books">Books &amp; Notes</option>
      <option value="jewelry">Jewelry</option>
      <option value="sports">Sports Equipment</option>
      <option value="other">Other</option>
    </select><br><br>

    <label for="description">Item Description *</label><br>
    <textarea id="description" placeholder="Color, brand, size, any identifying marks..." rows="5" cols="50" required></textarea><br><br>

    <label for="dateLost">Date Lost *</label><br>
    <input type="date" id="dateLost" required /><br><br>

    <label for="locationLost">Location Lost (if known)</label><br>
    <input type="text" id="locationLost" placeholder="e.g. Library 2nd floor, Gym locker room" /><br><br>

    <label for="image">Upload a Photo (optional)</label><br>
    <input type="file" id="image" accept="image/*" /><br><br>

    <button type="submit">Submit Report</button>

    <p id="formMessage"></p>
  </form>

  <script>
    document.getElementById("lostItemForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const formData = {
        id:           Date.now(),
        name:         document.getElementById("name").value.trim(),
        email:        document.getElementById("email").value.trim(),
        phone:        document.getElementById("phone").value.trim(),
        notify:       document.querySelector('input[name="notifyEmail"]:checked')?.value || "none",
        itemName:     document.getElementById("itemName").value.trim(),
        category:     document.getElementById("category").value,
        description:  document.getElementById("description").value.trim(),
        dateLost:     document.getElementById("dateLost").value,
        locationLost: document.getElementById("locationLost").value.trim(),
        status:       "new",
        submittedAt:  new Date().toISOString(),
      };

      // Save to localStorage
      const existing = JSON.parse(localStorage.getItem("lostRequests") || "[]");
      existing.unshift(formData);
      localStorage.setItem("lostRequests", JSON.stringify(existing));

      document.getElementById("formMessage").textContent = "Your report has been submitted! We will notify you if your item is found.";
      document.getElementById("lostItemForm").reset();
    });
  </script>
</body>
</html>
