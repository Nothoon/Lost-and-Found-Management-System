<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found - Employee Login</title>
  <link rel="stylesheet" href="../css/emplo.css">
  <style>
    :focus {
      outline: 3px solid rgba(88, 144, 255, 0.9);
      outline-offset: 2px;
    }

    .message {
      color: #b00020;
      margin-top: 0.5rem;
    }

    .password-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    #togglePasswordBtn {
      white-space: nowrap;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Employee Login</h1>

    <p>Please sign in with your employee credentials to access the Lost & Found system.</p>

    <!-- Login Form -->
    <form id="loginForm">
      <label for="emailLogin" class="add-margin">Email Address:</label>
      <input type="text" id="emailLogin" name="emailLogin" placeholder="name@company.com" required />

      <label for="passwordLogin" class="add-margin">Password:</label>
      <div class="password-row">
        <input type="password" id="passwordLogin" name="passwordLogin" placeholder="Enter password" required />
        <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
          Show
        </button>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rememberMe" name="rememberMe" />
        <label for="rememberMe">Remember me</label>
      </div>

      <button type="submit">Sign In</button>

      <p id="loginMessage" class="message"></p>
    </form>

    <div class="actions">
      <button type="button" onclick="toggleForgotPassword()">Reset my password</button>
    </div>

    <br>

    <div id="forgotPasswordSection" style="display:none;">
      <h2>Password Reset</h2>
      <p>Enter your email address and we’ll send password reset instructions (demo only).</p>

      <form id="forgotForm">
        <label for="emailReset" class="add-margin">Email Address:</label>
        <input type="text" id="emailReset" name="emailReset" placeholder="name@company.com" required />

        <button type="submit">Send Reset Email</button>

        <p id="forgotMessage" class="message"></p>
      </form>
    </div>

    <hr>
    <!-- testing -->
    <details>
      <summary>FOR TESTING</summary>
      <p>
        Test login:<br>
        Email: <b>test@gmail.com</b><br>
        Password: <b>TEST</b>
      </p>
    </details>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const forgotForm = document.getElementById('forgotForm');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const toggleForgotBtn = document.getElementById('toggleForgotBtn');
      const forgotSection = document.getElementById('forgotPasswordSection');
      const loginMessage = document.getElementById('loginMessage');
      const forgotMessage = document.getElementById('forgotMessage');

      // Accessible show/hide password
      togglePasswordBtn.addEventListener('click', function () {
        const pwd = document.getElementById('passwordLogin');
        const isHidden = pwd.type === 'password';
        pwd.type = isHidden ? 'text' : 'password';
        togglePasswordBtn.textContent = isHidden ? 'Hide' : 'Show';
        togglePasswordBtn.setAttribute('aria-pressed', String(isHidden));
      });

      // Toggle forgot password section
      toggleForgotBtn.addEventListener('click', function () {
        const isHidden = forgotSection.style.display === 'none' || forgotSection.style.display === '';
        forgotSection.style.display = isHidden ? 'block' : 'none';
        if (!isHidden) {
          // hiding -> clear messages
          if (forgotMessage) forgotMessage.textContent = '';
        }
      });

      // Clear messages when user starts typing
      ['emailLogin', 'passwordLogin', 'emailReset'].forEach(function (id) {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', function () {
            if (loginMessage) loginMessage.textContent = '';
            if (forgotMessage) forgotMessage.textContent = '';
          });
        }
      });

      // Login submit handler
      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        // Use browser validation first
        if (!loginForm.checkValidity()) {
          loginForm.reportValidity();
          return;
        }

        const email = document.getElementById('emailLogin').value.trim();
        const password = document.getElementById('passwordLogin').value;
        const remember = document.getElementById('rememberMe').checked;

        // Demo shortcut for local prototype tests
        if (email === 'test@gmail.com' && password === 'TEST') {
          window.location.href = 'employee-dashboard.html';
          return;
        }

        // Try to POST credentials to the server as JSON. If the server isn't implemented,
        // fallback to a friendly message. We don't expose which field failed.
        try {
          const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, remember })
          });

          if (res.ok) {
            // assume server sets a session cookie and redirects to dashboard
            window.location.href = 'employee-dashboard.html';
            return;
          } else if (res.status === 401) {
            loginMessage.textContent = 'Incorrect email address or password.';
            document.getElementById('passwordLogin').value = ''; // clear sensitive field
            document.getElementById('passwordLogin').focus();
            return;
          } else {
            loginMessage.textContent = 'Unable to sign in right now. Please try again later.';
            return;
          }
        } catch (err) {
          // Network or other error — fall back to generic message
          loginMessage.textContent = 'Incorrect email address or password.';
          document.getElementById('passwordLogin').value = '';
          document.getElementById('passwordLogin').focus();
        }
      });

      // Forgot password submit
      forgotForm.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!forgotForm.checkValidity()) {
          forgotForm.reportValidity();
          return;
        }

        const email = document.getElementById('emailReset').value.trim();

        // In a real app we'd POST to a reset endpoint. For this prototype show a generic message.
        forgotMessage.textContent = 'If this email is on file, password reset instructions will be sent.';
      });
    });
  </script>
</body>
</html>
