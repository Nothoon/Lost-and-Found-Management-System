<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found - Employee Login</title>
  <link rel="stylesheet" href="../css/employee-login.css">
  <style>
  </style>
</head>

<body>
  <div class="container">
    <h1>Employee Login</h1>

    <p>Please sign in with your employee credentials to access the Lost & Found system.</p>

    <!-- Login Form -->
    <form id="loginForm">
      <label for="emailLogin" class="add-margin">Email Address:</label>
      <input type="text" id="emailLogin" name="emailLogin" placeholder="name@company.com" required />

      <label for="passwordLogin" class="add-margin">Password:</label>
      <div class="password-row">
        <input type="password" id="passwordLogin" name="passwordLogin" placeholder="Enter password" required />
        <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
          Show
        </button>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rememberMe" name="rememberMe" />
        <label for="rememberMe">Remember me</label>
      </div>

      <button type="submit">Sign In</button>

      <p id="loginMessage" class="message"></p>
    </form>

    <div class="actions">
      <button type="button" onclick="toggleForgotPassword()">Reset my password</button>
    </div>

    <br>

    <div id="forgotPasswordSection" style="display:none;">
      <h2>Password Reset</h2>
      <p>Enter your email address and we’ll send password reset instructions (demo only).</p>

      <form id="forgotForm">
        <label for="emailReset" class="add-margin">Email Address:</label>
        <input type="text" id="emailReset" name="emailReset" placeholder="name@company.com" required />

        <button type="submit">Send Reset Email</button>

        <p id="forgotMessage" class="message"></p>
      </form>
    </div>

    <hr>
    <!-- testing -->
    <details>
      <summary>FOR TESTING</summary>
      <p>
        Test login:<br>
        Email: <b>test@gmail.com</b><br>
        Password: <b>TEST</b>
      </p>
    </details>
  </div>

  <script>
    function isEmailBasicValid(emailText) {
      return emailText.includes("@") && emailText.includes(".");
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById("passwordLogin");
      const btn = document.getElementById("togglePasswordBtn");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        btn.textContent = "Hide";
      } else {
        passwordInput.type = "password";
        btn.textContent = "Show";
      }
    }

    // toggle forgot password section show/hide
    function toggleForgotPassword() {
      const section = document.getElementById("forgotPasswordSection");
      const forgotMsg = document.getElementById("forgotMessage");

      if (section.style.display === "none" || section.style.display === "") {
        section.style.display = "block";
      } else {
        section.style.display = "none";
        if (forgotMsg) {
          forgotMsg.textContent = "";
        }
      }
    }

    //login submit
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault(); // stop page refresh

      const email = document.getElementById("emailLogin").value.trim();
      const password = document.getElementById("passwordLogin").value;
      const messageEl = document.getElementById("loginMessage");

      //validate email format
      if (!isEmailBasicValid(email)) {
        messageEl.textContent = 'Please enter a valid email address (include "@" and ".").';
        return;
      }

      //check test credentials
      if (email === "test@gmail.com" && password === "TEST") {
        window.location.href = "employee-dashboard.html";
      } else {
        messageEl.textContent = "Incorrect email address or password.";
      }

    });

    //forgot password submit
    document.getElementById("forgotForm").addEventListener("submit", function (event) {
      event.preventDefault(); // stop page refresh

      const email = document.getElementById("emailReset").value.trim();
      const msg = document.getElementById("forgotMessage");

      // validate email format
      if (!isEmailBasicValid(email)) {
        msg.textContent = 'Please enter a valid email address (include "@" and ".").';
        return;
      }

      msg.textContent = "If this email is on file, password reset instructions will be sent.";
    });
  </script>
</body>
</html>
