<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Rquest Form</title>

    <style>
        label.add-margin{
            display: block;
            margin-bottom: 10px;
        }
        input {
            margin-bottom: 10px;
        }
        .container {
            font-family: 'Times New Roman', Times, serif;
            background-color: beige;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            height: 100%;
            max-width: 450px;
            max-height: 700px;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: dimgrey;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;  /* Full viewport height */

        }
    </style>
</head>
<body>
    <div class="container">
    <h1>Lost & Found Request Form</h1>
    <form id="ReqForm" action="/submit" method="POST" enctype="multipart/form-data">
        <div class="form-group">
        <!--Enter Name-->
            <label for="name"class="add-margin">Name:</label>
            <input id="name" placeholder="Enter name" required />
        <!--Enter Email-->
            <label for="email" class="add-margin">Email:</label>
            <input id="email" placeholder="Enter email" required />
         <!--Email Notis-->
        <div class="form-group">
            <label for="noti">Would you like email notifications?</label>
            <input type="radio" id="yes" name="noti" value="yes"/>
            <label for="yes">Yes</label>
            <input type="radio" id="no" name="noti" value="no"/>
            <label for="no">No</label>
        </div>
        <!--Image Submission-->
            <label for="image" class="add-margin">Upload Your Image:</label>
            <input type="file" id="image" name="image" accept="image/*" >
        <!--Item Description-->
            <label for="description" class="add-margin">Add a description for your item:</label>
            <textarea id="description" placeholder="Type here" rows="5" cols="50" required ></textarea>
        <!--Enter Date-->
            <label for="date" class="add-margin">Date Lost:</label>
            <input id="date" placeholder="MM/DD/YYYY" required />
        </div>

        <button type="submit">Submit</button>
    </div>
    </form>
</body>
</html>
